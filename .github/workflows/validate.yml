name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Catches a change in Home Assistant or HACS that breaks validation between pushes.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action validates public repositories only; it runs once this
    # repository is public. The catalog accepts only a run without `ignore`.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
